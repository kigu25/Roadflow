<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RoadFlow</title>

    <link rel="stylesheet" href="/static/index.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

</head>

<body>
    <div class="top-bar">
        <h1>RoadFlow</h1>
        <div class="nav-bar">
            <div class="buttons">
                <div class="adminButton">
                    <button onclick="location.href='/admin'">Admin-page</button>
                </div>
                <div class="button2">
                    <button onclick="location.href='/'">Loremipsum</button>
                </div>
                <div class="button3">
                    <button onclick="location.href='/'">Loremipsum</button>
                </div>
            </div>
        </div>
    </div>
    <div id="leaf_map"></div>

    <div id="control_row">
        <input type="range" min="0" max="1435" value="720" step="15" class="time_slider" id="time_slider">
        <datalist id="hours">
            <option value="0" label="00:00"></option>
            <option value="3" label="03:00"></option>
            <option value="6" label="06:00"></option>
            <option value="9" label="09:00"></option>
            <option value="12" label="12:00"></option>
            <option value="15" label="15:00"></option>
            <option value="18" label="18:00"></option>
            <option value="21" label="21:00"></option>
            <option value="24" label="24:00"></option>
        </datalist>
        <p id="ouput_heading">Selected time: <output id="output_text"></output></p>
        <label for="date_slider">Date:</label>
        <input type="date" id="date" name="date_slider" value="2026-10-07" min="2026-10-05">
    </div>

    <div id="camera_info_box">
        <h2 id="camera_details">Camera details</h2>
        <h2 id="camera_name"></h2>
        <p id="camera_id" class="camera_info_row"></p>
        <p id="latitude" class="camera_info_row"></p>
        <p id="longitude" class="camera_info_row"></p>
        <p id="trafikverket_id" class="camera_info_row"></p>
        <p id="avg_vehicles" class="camera_info_row"></p>
        <p id="max_vehicles" class="camera_info_row"></p>
        <img id="latest_camera_img">
    </div>

    <div id="graph_render_box">
        <div id="chart"></div>
    </div>


    <script src="/static/time_slider.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="/static/data_charts.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/camera_details.js"></script>
    <script src="/static/leaf_map.js"></script>
</body>
</html>
