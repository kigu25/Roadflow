<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RoadFlow</title>

    <link rel="stylesheet" href="/static/index.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

</head>

<body>
    <div class="top-bar">
        <h1>RoadFlow</h1>
        <div class="nav-bar">
            <div class="buttons">
                <div class="adminButton">
                    <button onclick="location.href='/admin'">Admin-page</button>
                </div>
                <div class="button2">
                    <button onclick="location.href='/'">Loremipsum</button>
                </div>
                <div class="button3">
                    <button onclick="location.href='/'">Loremipsum</button>
                </div>
            </div>
        </div>
    </div>
    <div id="leaf_map"></div>
    <div id="control_row">
        <button>"Click"</button>
    </div>
    <div id="camera_info_box">
        <h2 id="camera_details">Camera details</h2>
        <h2 id="camera_name"></h2>
        <p id="camera_id" class="camera_info_row"></p>
        <p id="latitude" class="camera_info_row"></p>
        <p id="longitude" class="camera_info_row"></p>
        <p id="trafikverket_id" class="camera_info_row"></p>
        <p id="avg_vehicles" class="camera_info_row"></p>
        <p id="max_vehicles" class="camera_info_row"></p>
        <img id="latest_camera_img">
    </div>

    <div id="graph_render_box">
        <div id="chart"></div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="/static/data_charts.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/camera_details.js"></script>
    <script src="/static/leaf_map.js"></script>
</body>
</html>
